[workspace]
resolver = "2"
members = ["crates/slack-api", "crates/slack-ui", "crates/slack-app"]
default-members = ["crates/slack-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
slack-api = { path = "crates/slack-api" }
slack-ui = { path = "crates/slack-ui" }

gpui = { version = "0.2.2", git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component" }
reqwest_client = { git = "https://github.com/zed-industries/zed" }

anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart", "charset", "http2"] }
futures = "0.3"
log = "0.4"
chrono = "0.4"
url = "2"
percent-encoding = "2"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
dirs = "6"
regex = "1"

[workspace.lints.rust]
unused_variables = "warn"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
